components:
  schemas:
    DayAvailability:
      type: object
      required:
        - start
        - end
        - isAvailable
      properties:
        start:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        end:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        isAvailable:
          type: boolean
    DoctorAvailability:
      type: object
      required:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
      properties:
        monday:
          $ref: '#/components/schemas/DayAvailability'
        tuesday:
          $ref: '#/components/schemas/DayAvailability'
        wednesday:
          $ref: '#/components/schemas/DayAvailability'
        thursday:
          $ref: '#/components/schemas/DayAvailability'
        friday:
          $ref: '#/components/schemas/DayAvailability'
        saturday:
          $ref: '#/components/schemas/DayAvailability'
        sunday:
          $ref: '#/components/schemas/DayAvailability'
    Doctor:
      type: object
      required:
        - id
        - firstName
        - lastName
        - specialtyId
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
        specialtyId:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/DoctorAvailability'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateDoctorRequest:
      type: object
      required:
        - firstName
        - lastName
        - specialtyId
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
          format: email
        specialtyId:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/DoctorAvailability'
    UpdateDoctorRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        phone:
          type: string
        email:
          type: string
          format: email
        specialtyId:
          type: string
          format: uuid
        availability:
          $ref: '#/components/schemas/DoctorAvailability'
    TriageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            complaint:
              type: string
            symptomDuration:
              type: string
            symptom:
              type: string
            actionTaken:
              type: string
            reactionAfterAction:
              type: string
            status:
              type: string
              enum:
                - PENDENTE
                - EM_ANALISE
                - CANCELADO
                - REENCAMINHADO
            patientId:
              type: string
            analyzedById:
              type: string
            specialtyId:
              type: string
            consultationTypeId:
              type: string
            priority:
              type: string
              enum:
                - BAIXA
                - MEDIA
                - ALTA
            rejectionReason:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            patient:
              type: object
              properties:
                id:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phone:
                  type: string
            analyzedBy:
              type: object
              properties:
                id:
                  type: string
                firstName:
                  type: string
                lastName:
                  type: string
            specialty:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            consultationType:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
