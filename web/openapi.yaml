openapi: 3.1.0
info:
  title: Powered By Arkos.js
  version: 1.0.0
  description: This API was automatically generated by Arkos.js, read more about
    at www.arkosjs.com
servers:
  - url: http://localhost:8000
    description: Local Development Server
paths:
  /api/uploads/{path}:
    get:
      tags:
        - File Upload
      summary: Retrieve uploaded file
      description: Serves static files from the upload directory (uploads). Uses
        wildcard path matching to serve files from any subdirectory.
      operationId: findFile
      responses:
        "200":
          description: File retrieved successfully
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: File not found
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Path to the file including file type directory (e.g.,
            images/photo.jpg)
  /api/uploads/{fileType}:
    post:
      tags:
        - File Upload
      summary: Upload file(s)
      description: Upload one or multiple files. Supports image processing options for
        image uploads.
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images[0]:
                  type: string
                  format: binary
                videos[0]:
                  type: string
                  format: binary
                documents[0]:
                  type: string
                  format: binary
                files[0]:
                  type: string
                  format: binary
      responses:
        "200":
          description: File(s) uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    oneOf:
                      - type: string
                        description: URL of uploaded file
                      - type: array
                        items:
                          type: string
                        description: URLs of uploaded files
                  message:
                    type: string
        "400":
          description: Invalid file type, size limit exceeded, or no file uploaded
      parameters:
        - name: fileType
          in: path
          required: true
          schema:
            type: string
            enum:
              - images
              - videos
              - documents
              - files
          description: Type of file being uploaded
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - jpeg
              - jpg
              - png
              - webp
              - gif
              - avif
          description: Image format for conversion (only applicable for fileType=images)
        - name: width
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Target width for image resize (only applicable for fileType=images)
        - name: height
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Target height for image resize (only applicable for fileType=images)
        - name: resizeTo
          in: query
          required: false
          schema:
            type: string
            enum:
              - cover
              - contain
              - fill
              - inside
              - outside
          description: Resize strategy (only applicable for fileType=images)
  /api/uploads/{fileType}/{fileName}:
    patch:
      tags:
        - File Upload
      summary: Update existing file
      description: Replace an existing file with a new one. Deletes the old file and
        uploads the new one.
      operationId: updateFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images[0]:
                  type: string
                  format: binary
                videos[0]:
                  type: string
                  format: binary
                documents[0]:
                  type: string
                  format: binary
                files[0]:
                  type: string
                  format: binary
      responses:
        "200":
          description: File updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    oneOf:
                      - type: string
                        description: URL of updated file
                      - type: array
                        items:
                          type: string
                        description: URLs of updated files
                  message:
                    type: string
        "400":
          description: Invalid file type, size limit exceeded, or no file uploaded
        "404":
          description: Original file not found
      parameters:
        - name: fileType
          in: path
          required: true
          schema:
            type: string
            enum:
              - images
              - videos
              - documents
              - files
          description: Type of file being updated
        - name: fileName
          in: path
          required: true
          schema:
            type: string
          description: Name of the file to update
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - jpeg
              - jpg
              - png
              - webp
              - gif
              - avif
          description: Image format for conversion (only applicable for fileType=images)
        - name: width
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Target width for image resize (only applicable for fileType=images)
        - name: height
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Target height for image resize (only applicable for fileType=images)
        - name: resizeTo
          in: query
          required: false
          schema:
            type: string
            enum:
              - cover
              - contain
              - fill
              - inside
              - outside
          description: Resize strategy (only applicable for fileType=images)
    delete:
      tags:
        - File Upload
      summary: Delete file
      description: Delete an uploaded file from the server
      operationId: deleteFile
      responses:
        "204":
          description: File deleted successfully
        "404":
          description: File not found
      parameters:
        - name: fileType
          in: path
          required: true
          schema:
            type: string
            enum:
              - images
              - videos
              - documents
              - files
          description: Type of file being deleted
        - name: fileName
          in: path
          required: true
          schema:
            type: string
          description: Name of the file to delete
  /api/users/me:
    get:
      tags:
        - Authentication
      summary: Get current user information
      description: Retrieves information about the currently authenticated user
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    default: UTILIZADOR
                    enum:
                      - UTILIZADOR
                      - ADMINISTRADOR
                      - RECEPCIONISTA
                      - // change or add new roles
                  firstName:
                    type: string
                  lastName:
                    type: string
                  phone:
                    type: string
                  birthDate:
                    type: string
                    format: date-time
                  province:
                    type: string
                    enum:
                      - MAPUTO
                      - XAI_XAI
                      - INHAMBANE
                      - SOFALA
                      - MANICA
                      - TETE
                      - ZAMBEZIA
                      - NAMPULA
                      - NIASSA
                      - CABO_DELGADO
                  city:
                    type: string
                  neighborhood:
                    type: string
                  doctorAvailability:
                    type: object
                  doctorSpecialtyId:
                    type: string
                  passwordChangedAt:
                    type: string
                    format: date-time
                  lastLoginAt:
                    type: string
                    format: date-time
                  isSuperUser:
                    type: boolean
                    default: false
                  isStaff:
                    type: boolean
                    default: false
                  deletedSelfAccountAt:
                    type: string
                    format: date-time
                  isActive:
                    type: boolean
                    default: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - email
                  - role
                  - isSuperUser
                  - isStaff
                  - isActive
                  - createdAt
                  - updatedAt
        "401":
          description: Authentication required
      parameters: []
    patch:
      tags:
        - Authentication
      summary: Update current user information
      description: Updates information for the currently authenticated user
      operationId: updateMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    default: UTILIZADOR
                    enum:
                      - UTILIZADOR
                      - ADMINISTRADOR
                      - RECEPCIONISTA
                      - // change or add new roles
                  firstName:
                    type: string
                  lastName:
                    type: string
                  phone:
                    type: string
                  birthDate:
                    type: string
                    format: date-time
                  province:
                    type: string
                    enum:
                      - MAPUTO
                      - XAI_XAI
                      - INHAMBANE
                      - SOFALA
                      - MANICA
                      - TETE
                      - ZAMBEZIA
                      - NAMPULA
                      - NIASSA
                      - CABO_DELGADO
                  city:
                    type: string
                  neighborhood:
                    type: string
                  doctorAvailability:
                    type: object
                  doctorSpecialtyId:
                    type: string
                  passwordChangedAt:
                    type: string
                    format: date-time
                  lastLoginAt:
                    type: string
                    format: date-time
                  isSuperUser:
                    type: boolean
                    default: false
                  isStaff:
                    type: boolean
                    default: false
                  deletedSelfAccountAt:
                    type: string
                    format: date-time
                  isActive:
                    type: boolean
                    default: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - email
                  - role
                  - isSuperUser
                  - isStaff
                  - isActive
                  - createdAt
                  - updatedAt
        "400":
          description: Invalid input data
        "401":
          description: Authentication required
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  minLength: 1
                  type: string
              type: object
    delete:
      tags:
        - Authentication
      summary: Delete current user account
      description: Marks the current user's account as deleted
      operationId: deleteMe
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account deleted successfully
        "401":
          description: Authentication required
      parameters: []
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login to the system
      description: Authenticates a user and returns an access token
      operationId: login
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: JWT access token
        "400":
          description: Invalid input data
        "401":
          description: Invalid credentials
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                password:
                  pattern: "[a-z]"
                  type: string
                  minLength: 8
              type: object
              required:
                - email
                - password
  /api/auth/logout:
    delete:
      tags:
        - Authentication
      summary: Logout from the system
      description: Invalidates the current user's JWT token
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Logout successful
        "401":
          description: Authentication required
      parameters: []
  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account
      operationId: signup
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    default: UTILIZADOR
                    enum:
                      - UTILIZADOR
                      - ADMINISTRADOR
                      - RECEPCIONISTA
                      - // change or add new roles
                  firstName:
                    type: string
                  lastName:
                    type: string
                  phone:
                    type: string
                  birthDate:
                    type: string
                    format: date-time
                  province:
                    type: string
                    enum:
                      - MAPUTO
                      - XAI_XAI
                      - INHAMBANE
                      - SOFALA
                      - MANICA
                      - TETE
                      - ZAMBEZIA
                      - NAMPULA
                      - NIASSA
                      - CABO_DELGADO
                  city:
                    type: string
                  neighborhood:
                    type: string
                  doctorAvailability:
                    type: object
                  doctorSpecialtyId:
                    type: string
                  passwordChangedAt:
                    type: string
                    format: date-time
                  lastLoginAt:
                    type: string
                    format: date-time
                  isSuperUser:
                    type: boolean
                    default: false
                  isStaff:
                    type: boolean
                    default: false
                  deletedSelfAccountAt:
                    type: string
                    format: date-time
                  isActive:
                    type: boolean
                    default: true
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - email
                  - role
                  - isSuperUser
                  - isStaff
                  - isActive
                  - createdAt
                  - updatedAt
        "400":
          description: Invalid input data
        "409":
          description: User already exists
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  minLength: 1
                  type: string
                password:
                  pattern: "[a-z]"
                  type: string
                  minLength: 8
              type: object
              required:
                - email
                - password
  /api/auth/update-password:
    post:
      tags:
        - Authentication
      summary: Update user password
      description: Changes the password for the authenticated user
      operationId: updatePassword
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Password updated successfully!
        "400":
          description: Invalid input data or current password incorrect
        "401":
          description: Authentication required
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                currentPassword:
                  minLength: 1
                  type: string
                newPassword:
                  pattern: "[a-z]"
                  type: string
                  minLength: 8
              type: object
              required:
                - currentPassword
                - newPassword
  /api/auth-actions:
    get:
      tags:
        - Authentication
      summary: Get all authentication actions
      description: Retrieves a list of all available authentication actions and permissions
      operationId: findManyAuthAction
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auth actions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    description: Action name, e.g Create, View, Update, Download, Cancel
                  resource:
                    type: string
                    description: Resource name, e.g user, user-role, product, author
                  name:
                    type: string
                    description: Human-readable name for this permission
                    nullable: true
                  description:
                    type: string
                    description: Detailed description of what this permission allows
                    nullable: true
                  errorMessage:
                    type: string
                    description: Error message returned on forbidden response
                    nullable: true
                  roles:
                    type: array
                    description: Role names that have this permission, e.g Admin, Manager
                    items:
                      type: string
                required:
                  - action
                  - resource
                additionalProperties: false
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
      parameters: []
  /api/auth-actions/{resourceName}:
    get:
      tags:
        - Authentication
      summary: Get authentication actions by resource
      description: Retrieves all authentication actions for a specific resource
      operationId: findOneAuthAction
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Auth actions for resource retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    description: Action name, e.g Create, View, Update, Download, Cancel
                  resource:
                    type: string
                    description: Resource name, e.g user, user-role, product, author
                  name:
                    type: string
                    description: Human-readable name for this permission
                    nullable: true
                  description:
                    type: string
                    description: Detailed description of what this permission allows
                    nullable: true
                  errorMessage:
                    type: string
                    description: Error message returned on forbidden response
                    nullable: true
                  roles:
                    type: array
                    description: Role names that have this permission, e.g Admin, Manager
                    items:
                      type: string
                required:
                  - action
                  - resource
                additionalProperties: false
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "404":
          description: Resource not found
      parameters:
        - name: resourceName
          in: path
          required: true
          schema:
            type: string
          description: Name of the resource to retrieve auth actions for
  /api/appointments:
    post:
      tags:
        - Appointments
      summary: Create a new appointment
      description: Creates a new appointment record in the system
      operationId: createAppointment
      security:
        - BearerAuth: []
      responses:
        "201":
          description: appointment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  date:
                    type: string
                    format: date-time
                  patientId:
                    type: string
                  specialtyId:
                    type: string
                  consultationTypeId:
                    type: string
                  doctorId:
                    type: string
                  triageId:
                    type: string
                  notes:
                    type: string
                  status:
                    type: string
                    default: AGENDADA
                    enum:
                      - AGENDADA
                      - CANCELADA
                      - REAGENDADA
                      - CONCLUIDA
                  priority:
                    type: string
                    default: MEDIA
                    enum:
                      - BAIXA
                      - MEDIA
                      - ALTA
                  source:
                    type: string
                    default: DIRECTA
                    enum:
                      - TRIAGEM
                      - DIRECTA
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - date
                  - patientId
                  - specialtyId
                  - consultationTypeId
                  - status
                  - priority
                  - source
                  - createdAt
                  - updatedAt
        "400":
          description: Invalid input data provided
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                date:
                  oneOf:
                    - format: date
                      type: string
                    - format: date-time
                      type: string
                patient:
                  properties:
                    id:
                      type: string
                      minLength: 1
                  type: object
                  required:
                    - id
                specialty:
                  properties:
                    id:
                      type: string
                      minLength: 1
                  type: object
                  required:
                    - id
                consultationType:
                  properties:
                    id:
                      type: string
                      minLength: 1
                  type: object
                  required:
                    - id
                doctor:
                  properties:
                    id:
                      type: string
                      minLength: 1
                  type: object
                  required:
                    - id
                triage:
                  properties:
                    id:
                      type: string
                      minLength: 1
                  type: object
                  required:
                    - id
                notes:
                  type: string
                  minLength: 1
                status:
                  enum:
                    - AGENDADA
                    - CANCELADA
                    - REAGENDADA
                    - CONCLUIDA
                  type: string
                priority:
                  enum:
                    - BAIXA
                    - MEDIA
                    - ALTA
                  type: string
                source:
                  enum:
                    - TRIAGEM
                    - DIRECTA
                  type: string
              type: object
              required:
                - date
    get:
      tags:
        - Appointments
      summary: Get appointments
      description: Retrieves a paginated list of appointments with optional filtering
        and sorting
      operationId: findAppointments
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of appointments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of records matching the criteria
                  results:
                    type: integer
                    description: Number of records returned in current page
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        date:
                          type: string
                          format: date-time
                        patientId:
                          type: string
                        specialtyId:
                          type: string
                        consultationTypeId:
                          type: string
                        doctorId:
                          type: string
                        triageId:
                          type: string
                        notes:
                          type: string
                        status:
                          type: string
                          default: AGENDADA
                          enum:
                            - AGENDADA
                            - CANCELADA
                            - REAGENDADA
                            - CONCLUIDA
                        priority:
                          type: string
                          default: MEDIA
                          enum:
                            - BAIXA
                            - MEDIA
                            - ALTA
                        source:
                          type: string
                          default: DIRECTA
                          enum:
                            - TRIAGEM
                            - DIRECTA
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - date
                        - patientId
                        - specialtyId
                        - consultationTypeId
                        - status
                        - priority
                        - source
                        - createdAt
                        - updatedAt
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
      parameters:
        - name: page
          in: query
          description: Page number (starts from 1)
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Sort field (prefix with '-' for descending order)
          schema:
            type: string
        - name: fields
          in: query
          description: Comma-separated list of fields to include in response
          schema:
            type: string
        - name: date
          in: query
          description: Filter by date
          schema:
            type: object
            properties:
              equals:
                type: string
                format: date-time
              gte:
                type: string
                format: date-time
              lte:
                type: string
                format: date-time
        - name: patient
          in: query
          description: Filter by patient (matches on id)
          schema:
            type: object
            properties:
              id:
                type: string
        - name: specialty
          in: query
          description: Filter by specialty (matches on id)
          schema:
            type: object
            properties:
              id:
                type: string
        - name: consultationType
          in: query
          description: Filter by consultationType (matches on id)
          schema:
            type: object
            properties:
              id:
                type: string
        - name: doctor
          in: query
          description: Filter by doctor (matches on id)
          schema:
            type: object
            properties:
              id:
                type: string
        - name: triage
          in: query
          description: Filter by triage (matches on id)
          schema:
            type: object
            properties:
              id:
                type: string
        - name: notes
          in: query
          description: Filter by notes
          schema:
            type: object
            properties:
              icontains:
                type: string
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum:
              - AGENDADA
              - CANCELADA
              - REAGENDADA
              - CONCLUIDA
        - name: priority
          in: query
          description: Filter by priority
          schema:
            type: string
            enum:
              - BAIXA
              - MEDIA
              - ALTA
        - name: source
          in: query
          description: Filter by source
          schema:
            type: string
            enum:
              - TRIAGEM
              - DIRECTA
        - name: createdAt
          in: query
          description: Filter by createdAt
          schema:
            type: object
            properties:
              equals:
                type: string
                format: date-time
              gte:
                type: string
                format: date-time
              lte:
                type: string
                format: date-time
        - name: updatedAt
          in: query
          description: Filter by updatedAt
          schema:
            type: object
            properties:
              equals:
                type: string
                format: date-time
              gte:
                type: string
                format: date-time
              lte:
                type: string
                format: date-time
  /api/appointments/{id}:
    get:
      tags:
        - Appointments
      summary: Get appointment by ID
      description: Retrieves a single appointment record by its unique identifier
      operationId: findAppointmentById
      security:
